<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p-quad Excess Kurtosis — Triangular Lattice</title>
  <style>
    :root{
      --ink:#111;
      --edge:#8389a4;
      --node-stroke:#555;
      --cream:#fffbe6;
      --font: Arial, Helvetica, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:white;color:var(--ink);font-family:var(--font);overflow:hidden}
    .slide{width:100vw;height:100vh;position:relative;background:white}
    .title{position:absolute;top:8px;left:0;width:100%;text-align:center;font-size:31px;line-height:1.08;font-weight:400;letter-spacing:.2px;z-index:2}
    svg#graph{position:absolute;left:50px;top:104px;width:940px;height:770px;overflow:visible}
    .edge{stroke:var(--edge);stroke-width:2.15;opacity:.95;stroke-linecap:round}
    .node{cursor:pointer}
    .node circle{stroke:var(--node-stroke);stroke-width:3.1;fill:var(--cream)}
    .node text{font-size:16px;font-weight:400;text-anchor:middle;dominant-baseline:central;fill:#111;pointer-events:none}
    .node.selected circle{stroke:#333;stroke-width:3.8}
    .node:hover circle{stroke:#111;stroke-width:4.2}
    #colorbar{position:absolute;right:230px;top:112px;width:95px;height:780px;overflow:visible}
    .tick text{font-size:24px;fill:#111}
    .tick line{stroke:#111;stroke-width:2.3}
    .bar-label{position:absolute;right:10px;top:430px;transform:rotate(-90deg);font-size:28px;font-weight:400}
    .mini-controls{position:absolute;left:18px;top:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:760px;opacity:.05;transition:.2s;z-index:10}
    .mini-controls:hover{opacity:1}
    button{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
    button.active{background:#111;color:white}
    input{border:1px solid #ddd;background:white;border-radius:999px;padding:8px 12px;font-size:13px;width:230px}
    .hint{position:absolute;left:18px;bottom:14px;color:#777;font-size:13px;opacity:0;transition:.2s}
    .slide:hover .hint{opacity:1}
  </style>
</head>
<body>
  <main class="slide">
    <div class="mini-controls">
      <button class="q active" data-q="p">p-quad</button>
      <button class="q" data-q="x">x-quad</button>
      <button class="pick active" data-pick="single">single</button>
      <button class="pick" data-pick="superpose">superpose</button>
      <button class="phase active" data-re="1" data-im="0">1</button>
      <button class="phase" data-re="0" data-im="1">i</button>
      <button class="phase" data-re="-1" data-im="0">-1</button>
      <button class="phase" data-re="0" data-im="-1">-i</button>
      <button id="centerBtn">center 25</button>
      <input id="modeInput" placeholder="25:1, 26:1 or 25:1+i">
      <button id="applyModeBtn">apply mode</button>
    </div>

    <div class="title" id="title">
      p-quad Excess Kurtosis<br>
      subtracted at center mode 25<br>
      minkurtotis = -1.193
    </div>

    <svg id="graph" viewBox="0 0 940 770"></svg>

    <svg id="colorbar" viewBox="0 0 95 780">
      <defs>
        <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#fffbe6"/>
          <stop offset="28%" stop-color="#d8dbc7"/>
          <stop offset="58%" stop-color="#879883"/>
          <stop offset="82%" stop-color="#607890"/>
          <stop offset="100%" stop-color="#49678f"/>
        </linearGradient>
      </defs>
      <path d="M20 0 H70 V700 L45 760 L20 700 Z" fill="url(#barGrad)" stroke="#111" stroke-width="2.5"/>
      <g id="ticks"></g>
    </svg>
    <div class="bar-label">Excess Kurtosis</div>
    <div class="hint">single: 노드 하나 선택. superpose: 위상 버튼 선택 후 여러 노드 클릭. 입력 예: 25:1, 26:i. F: fullscreen</div>
  </main>

<script>
// This is a direct JS translation of the Python function triangular_lattice_adjacency(n_rows).
function triangular_lattice_adjacency(n_rows) {
  const idx = {};
  let node = 0;

  for (let r = 0; r < n_rows; r++) {
    for (let c = 0; c < r + 1; c++) {
      idx[`${r},${c}`] = node;
      node += 1;
    }
  }

  const m = node;
  const Adj = Array.from({ length: m }, () => Array(m).fill(0));

  function add_edge(a, b) {
    const i = idx[`${a[0]},${a[1]}`];
    const j = idx[`${b[0]},${b[1]}`];
    Adj[i][j] = 1;
    Adj[j][i] = 1;
  }

  for (let r = 0; r < n_rows; r++) {
    for (let c = 0; c < r + 1; c++) {
      if (c < r) add_edge([r, c], [r, c + 1]);
      if (r < n_rows - 1) {
        add_edge([r, c], [r + 1, c]);
        add_edge([r, c], [r + 1, c + 1]);
      }
    }
  }

  const pos = {};
  for (const key of Object.keys(idx)) {
    const [r, c] = key.split(',').map(Number);
    const i = idx[key];
    const x = c - r / 2;
    const y = -Math.sqrt(3) / 2 * r;
    pos[i] = [x, y];
  }

  return { Adj, pos, idx, m };
}

const n_rows = 12;
const { Adj, pos: rawPos, idx, m } = triangular_lattice_adjacency(n_rows);
const centerNode = idx['6,3']; // zero-based index 24, label 25
let selected = centerNode;
let quad = 'p';
const squeezing_dB = 10;
const s = Math.pow(10, squeezing_dB / 10);
let modeCoeffs = singleMode(centerNode);
let pickMode = 'single';
let currentPhase = { re: 1, im: 0 };

function svgLayout(rawPos) {
  const points = Object.values(rawPos);
  const xs = points.map(p => p[0]);
  const ys = points.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const out = {};

  for (const [key, p] of Object.entries(rawPos)) {
    const x = 58 + (p[0] - minX) / (maxX - minX) * 820;
    const y = 92 + (maxY - p[1]) / (maxY - minY) * 610;
    out[Number(key)] = [x, y];
  }
  return out;
}
const pos = svgLayout(rawPos);

// V = G V0 G^T for G = [[I,0],[Adj,I]], V0 = diag(sI, 1/s I).
// We do not need to build the full V matrix. We only need diagonal variances and
// the two selected columns of M = V - I to compute A^- diagonal.
function M_entry(row, col) {
  const isRowX = row < m;
  const isColX = col < m;
  const r = isRowX ? row : row - m;
  const c = isColX ? col : col - m;

  if (isRowX && isColX) {
    return r === c ? s - 1 : 0;
  }

  if (isRowX && !isColX) {
    return s * Adj[r][c];
  }

  if (!isRowX && isColX) {
    return s * Adj[r][c];
  }

  // p-p block: s * Adj^2 + (1/s - 1) I
  let adj2 = 0;
  for (let k = 0; k < m; k++) adj2 += Adj[r][k] * Adj[k][c];
  return s * adj2 + (r === c ? 1 / s - 1 : 0);
}

function V_diag(index) {
  if (index < m) return s;
  const node = index - m;
  let degree = 0;
  for (let k = 0; k < m; k++) degree += Adj[node][k];
  return s * degree + 1 / s;
}

function graphDistances(start) {
  const dist = Array(m).fill(Infinity);
  const queue = [start];
  dist[start] = 0;
  while (queue.length > 0) {
    const v = queue.shift();
    for (let u = 0; u < m; u++) {
      if (Adj[v][u] === 1 && dist[u] > dist[v] + 1) {
        dist[u] = dist[v] + 1;
        queue.push(u);
      }
    }
  }
  return dist;
}

function singleMode(node) {
  const coeffs = Array.from({ length: m }, () => ({ re: 0, im: 0 }));
  coeffs[node] = { re: 1, im: 0 };
  return coeffs;
}

function coeffAbs(c) {
  return Math.hypot(c.re, c.im);
}

function normalizeCoeffs(coeffs) {
  const norm = Math.sqrt(coeffs.reduce((acc, c) => acc + c.re * c.re + c.im * c.im, 0));
  if (!Number.isFinite(norm) || norm === 0) throw new Error('mode norm is zero');
  return coeffs.map(c => ({ re: c.re / norm, im: c.im / norm }));
}

function activeModeCount() {
  return modeCoeffs.filter(c => coeffAbs(c) > 1e-10).length;
}

function parseComplex(text) {
  const s0 = text.trim().replace(/\s+/g, '').replace(/j/g, 'i');
  if (!s0) throw new Error('empty coefficient');
  if (!s0.includes('i')) return { re: Number(s0), im: 0 };
  if (!s0.endsWith('i')) throw new Error(`bad complex coefficient: ${text}`);

  const body = s0.slice(0, -1);
  if (body === '' || body === '+') return { re: 0, im: 1 };
  if (body === '-') return { re: 0, im: -1 };

  let split = -1;
  for (let i = 1; i < body.length; i++) {
    if (body[i] === '+' || body[i] === '-') split = i;
  }

  function parseImag(part) {
    if (part === '+') return 1;
    if (part === '-') return -1;
    return Number(part);
  }

  if (split === -1) return { re: 0, im: Number(body) };
  return {
    re: Number(body.slice(0, split)),
    im: parseImag(body.slice(split))
  };
}

function parseModeInput(text) {
  const coeffs = Array.from({ length: m }, () => ({ re: 0, im: 0 }));
  const terms = text.split(/[,\n]+/).map(x => x.trim()).filter(Boolean);
  if (terms.length === 0) throw new Error('mode input is empty');

  for (const term of terms) {
    const match = term.match(/^(\d+)\s*[:=]\s*(.+)$/);
    if (!match) throw new Error(`bad term: ${term}`);
    const node = Number(match[1]) - 1;
    if (!Number.isInteger(node) || node < 0 || node >= m) throw new Error(`node out of range: ${match[1]}`);

    const c = parseComplex(match[2]);
    if (!Number.isFinite(c.re) || !Number.isFinite(c.im)) throw new Error(`bad coefficient: ${match[2]}`);
    coeffs[node] = { re: coeffs[node].re + c.re, im: coeffs[node].im + c.im };
  }

  return coeffs;
}

function phaseVectorsFromCoeffs(coeffs) {
  coeffs = normalizeCoeffs(coeffs);
  const g = Array(2 * m).fill(0);
  const Jg = Array(2 * m).fill(0);
  for (let i = 0; i < m; i++) {
    const c = coeffs[i];
    g[i] = c.re;
    g[m + i] = -c.im;
    Jg[i] = c.im;
    Jg[m + i] = c.re;
  }
  return { g, Jg };
}

function modeAnchorNode() {
  let best = 0;
  let bestAbs = -1;
  for (let i = 0; i < m; i++) {
    const a = coeffAbs(modeCoeffs[i]);
    if (a > bestAbs) {
      best = i;
      bestAbs = a;
    }
  }
  return best;
}

function isSingleMode() {
  return modeCoeffs.filter(c => coeffAbs(c) > 1e-10).length === 1;
}

function setSingleMode(node) {
  selected = node;
  pickMode = 'single';
  modeCoeffs = singleMode(node);
  renderGraph();
}

function samePhase(a, b) {
  return Math.abs(a.re - b.re) < 1e-10 && Math.abs(a.im - b.im) < 1e-10;
}

function toggleSuperpositionNode(node) {
  const old = modeCoeffs[node];
  const active = coeffAbs(old) > 1e-10;

  if (active && samePhase(old, currentPhase) && activeModeCount() > 1) {
    modeCoeffs[node] = { re: 0, im: 0 };
  } else {
    modeCoeffs[node] = { ...currentPhase };
  }

  selected = modeAnchorNode();
  renderGraph();
}

function coeffText(c) {
  if (Math.abs(c.im) < 1e-10) return `${c.re.toFixed(2)}`;
  if (Math.abs(c.re) < 1e-10) return `${c.im.toFixed(2)}i`;
  return `${c.re.toFixed(2)}${c.im >= 0 ? '+' : ''}${c.im.toFixed(2)}i`;
}

function modeInputText() {
  return modeCoeffs
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => coeffAbs(c) > 1e-10)
    .map(({ c, i }) => `${i + 1}:${coeffText(c)}`)
    .join(', ');
}

function excessKurtosisFromVarAndA(varQ, Aii) {
  // For W^-(r) = 1/2 [r^T V^{-1} A^- V^{-1} r - Tr(V^{-1}A^-) + 2] W_G(r),
  // <Q^2> = Var(Q) + Aii and <Q^4> = 3 Var(Q)^2 + 6 Var(Q) Aii.
  const second = varQ + Aii;
  const fourth = 3 * varQ * varQ + 6 * varQ * Aii;
  return fourth / (second * second) - 3;
}

function computeKurtosisForMode() {
  const { g, Jg } = phaseVectorsFromCoeffs(modeCoeffs);

  function Mdot(row, vec) {
    let out = 0;
    for (let col = 0; col < 2 * m; col++) out += M_entry(row, col) * vec[col];
    return out;
  }

  const Mg = Array.from({ length: 2 * m }, (_, row) => Mdot(row, g));
  const MJg = Array.from({ length: 2 * m }, (_, row) => Mdot(row, Jg));

  // Pi_g = gg^T + Jg(Jg)^T, A^- = 2 M Pi_g M / Tr(M Pi_g)
  let denom = 0;
  for (let i = 0; i < 2 * m; i++) denom += g[i] * Mg[i] + Jg[i] * MJg[i];
  if (Math.abs(denom) < 1e-12) throw new Error('denom is close to zero');

  const Kx = Array(m).fill(0);
  const Kp = Array(m).fill(0);

  for (let node = 0; node < m; node++) {
    const xIndex = node;
    const pIndex = m + node;

    const A_xx = 2 * (Mg[xIndex] * Mg[xIndex] + MJg[xIndex] * MJg[xIndex]) / denom;
    const A_pp = 2 * (Mg[pIndex] * Mg[pIndex] + MJg[pIndex] * MJg[pIndex]) / denom;

    Kx[node] = excessKurtosisFromVarAndA(V_diag(xIndex), A_xx);
    Kp[node] = excessKurtosisFromVarAndA(V_diag(pIndex), A_pp);

    // Remove tiny floating-point residue only. This is not a two-hop hack.
    if (Math.abs(Kx[node]) < 1e-12) Kx[node] = 0;
    if (Math.abs(Kp[node]) < 1e-12) Kp[node] = 0;
  }

  return { Kx, Kp, Kmin: Kx.map((x, i) => Math.min(x, Kp[i])), dist: graphDistances(modeAnchorNode()) };
}

function valueFor(result, node) {
  if (quad === 'x') return result.Kx[node];
  return result.Kp[node];
}

function colorFromK(k) {
  // Same idea as matplotlib vmin=-0.3, vmax=0, extend='min'.
  const t = Math.max(0, Math.min(1, (-k) / 0.30));
  const stops = [
    [255, 251, 230],
    [216, 219, 199],
    [135, 152, 131],
    [96, 120, 144],
    [73, 103, 143]
  ];
  const x = t * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  const a = stops[i], b = stops[i + 1];
  const rgb = a.map((v, j) => Math.round(v + (b[j] - v) * f));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function selectedLabel() {
  const active = modeCoeffs
    .map((c, i) => ({ c, i, a: coeffAbs(c) }))
    .filter(x => x.a > 1e-10);

  if (active.length === 1) {
    const node = active[0].i;
    return node === centerNode ? 'center mode 25' : `mode ${node + 1}`;
  }

  const terms = active
    .sort((a, b) => b.a - a.a)
    .slice(0, 3)
    .map(({ c, i }) => {
      const im = Math.abs(c.im) < 1e-10 ? '' : `${c.im >= 0 ? '+' : ''}${c.im.toFixed(2)}i`;
      return `${i + 1}:${c.re.toFixed(2)}${im}`;
    });
  return `custom mode ${terms.join(', ')}${active.length > 3 ? ', ...' : ''}`;
}

function renderGraph() {
  const result = computeKurtosisForMode();
  const values = Array.from({ length: m }, (_, i) => valueFor(result, i));
  const minK = Math.min(...values);

  document.getElementById('title').innerHTML =
    `${quad}-quad Excess Kurtosis<br>` +
    `subtracted at ${selectedLabel()}<br>` +
    `minkurtotis = ${minK.toFixed(3)}`;

  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  for (let i = 0; i < m; i++) {
    for (let j = i + 1; j < m; j++) {
      if (Adj[i][j] === 1) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', pos[i][0]);
        line.setAttribute('y1', pos[i][1]);
        line.setAttribute('x2', pos[j][0]);
        line.setAttribute('y2', pos[j][1]);
        line.setAttribute('class', 'edge');
        svg.appendChild(line);
      }
    }
  }

  for (let i = 0; i < m; i++) {
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('class', 'node' + (coeffAbs(modeCoeffs[i]) > 1e-10 ? ' selected' : ''));
    group.setAttribute('transform', `translate(${pos[i][0]},${pos[i][1]})`);
    group.onclick = () => {
      if (pickMode === 'single') setSingleMode(i);
      else toggleSuperpositionNode(i);
    };

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('r', 19.3);
    circle.style.fill = colorFromK(values[i]);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.textContent = i + 1;

    group.appendChild(circle);
    group.appendChild(text);
    svg.appendChild(group);
  }

  document.querySelectorAll('.q').forEach(button => {
    button.classList.toggle('active', button.dataset.q === quad);
  });
  document.querySelectorAll('.pick').forEach(button => {
    button.classList.toggle('active', button.dataset.pick === pickMode);
  });
  document.querySelectorAll('.phase').forEach(button => {
    const phase = { re: Number(button.dataset.re), im: Number(button.dataset.im) };
    button.classList.toggle('active', samePhase(phase, currentPhase));
  });
  document.getElementById('modeInput').value = modeInputText();
}

function renderTicks() {
  const tickGroup = document.getElementById('ticks');
  const ticks = [
    ['0', 0], ['-0.05', 126], ['-0.1', 252], ['-0.15', 378],
    ['-0.2', 504], ['-0.25', 630], ['< -0.3', 760]
  ];
  for (const [label, y] of ticks) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'tick');

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 70);
    line.setAttribute('x2', 84);
    line.setAttribute('y1', y);
    line.setAttribute('y2', y);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', 92);
    text.setAttribute('y', y + 8);
    text.textContent = label;

    g.appendChild(line);
    g.appendChild(text);
    tickGroup.appendChild(g);
  }
}

document.querySelectorAll('.q').forEach(button => {
  button.onclick = () => { quad = button.dataset.q; renderGraph(); };
});
document.querySelectorAll('.pick').forEach(button => {
  button.onclick = () => {
    pickMode = button.dataset.pick;
    renderGraph();
  };
});
document.querySelectorAll('.phase').forEach(button => {
  button.onclick = () => {
    currentPhase = { re: Number(button.dataset.re), im: Number(button.dataset.im) };
    pickMode = 'superpose';
    renderGraph();
  };
});
document.getElementById('centerBtn').onclick = () => { setSingleMode(centerNode); };
document.getElementById('applyModeBtn').onclick = () => {
  try {
    modeCoeffs = parseModeInput(document.getElementById('modeInput').value);
    selected = modeAnchorNode();
    pickMode = isSingleMode() ? 'single' : 'superpose';
    renderGraph();
  } catch (err) {
    alert(err.message);
  }
};
document.getElementById('modeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('applyModeBtn').click();
});
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
});

renderTicks();
renderGraph();
</script>
</body>
</html>
